<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Asistencia</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ok:#16a34a;--ko:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111317;--card:#1b1e25;--tx:#eceef2;--mu:#9aa1ad;--bd:#2a2e37;--ac:#5b8def;--ok:#4ade80;--ko:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111317;--card:#1b1e25;--tx:#eceef2;--mu:#9aa1ad;--bd:#2a2e37;--ac:#5b8def;--ok:#4ade80;--ko:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button,.seg button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.seg{display:flex;gap:6px;margin-bottom:14px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer;width:100%;margin-top:10px}
.btn.s{background:var(--bd);color:var(--tx);width:auto;padding:6px 10px;margin:0 4px 0 0;font-size:13px}
video{width:100%;border-radius:12px;background:#000;max-height:340px;object-fit:cover;transform:scaleX(-1)}
.res{margin-top:12px;padding:14px;border-radius:12px;text-align:center;display:none}
.res.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.res.ko{display:block;background:color-mix(in srgb,var(--ko) 15%,transparent);border:1px solid var(--ko)}
.res b{font-size:18px}.mu{color:var(--mu);font-size:13px}
#clock{font-size:32px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
.hide{display:none}#qrbox{display:inline-block;background:#fff;padding:8px;border-radius:8px}
</style></head><body><main>
<h1>⏱️ Registro de Asistencia</h1><div class="mu" id="sync" style="margin:-6px 0 10px"></div>
<div class="tabs"><button data-t="reg" class="on">Registrar</button><button data-t="emp">Empleados</button><button data-t="log">Registros</button></div>

<section id="reg">
 <div class="card"><div id="clock"></div><div class="mu" id="date" style="text-align:center"></div></div>
 <div class="seg"><button data-m="num" class="on">Nº empleado</button><button data-m="qr">QR</button><button data-m="face">Rostro</button></div>
 <div class="card">
  <div id="m-num"><input id="numIn" placeholder="Número de empleado" inputmode="numeric"><button class="btn" id="numBtn">Registrar</button></div>
  <div id="m-cam" class="hide"><video id="vid" autoplay playsinline muted></video>
   <button class="btn hide" id="faceBtn">Reconocer rostro</button><label class="mu hide" id="faceLbl" style="display:block;margin-top:10px">¿No abre la cámara? Toma una foto: <input type="file" accept="image/*" capture="user" id="faceFile2"></label><div class="mu" id="camHint"></div></div>
  <div class="res" id="res"></div>
 </div>
</section>

<section id="emp" class="hide">
 <div class="card"><b>Nuevo empleado</b>
  <input id="eId" placeholder="Número de empleado" style="margin-top:8px"><input id="eName" placeholder="Nombre completo" style="margin-top:8px">
  <button class="btn" id="addEmp">Agregar</button></div>
 <div class="card" id="faceCard" class="hide" style="display:none"><b id="faceTitle"></b>
  <video id="vid2" autoplay playsinline muted style="margin-top:8px"></video>
  <button class="btn" id="snap">Capturar muestra (<span id="cnt">0</span>/3)</button>
  <label class="mu" style="display:block;margin-top:10px">¿No abre la cámara? Toma o sube una foto (repite 3 veces): <input type="file" accept="image/*" capture="user" id="faceFile"></label><button class="btn" id="faceDone" style="background:var(--ok)">Listo</button></div>
 <div class="card" id="qrCard" style="display:none;text-align:center"><b id="qrTitle"></b><div style="margin:10px 0"><div id="qrbox"></div></div><div class="mu" id="qrTxt"></div><div class="mu">Imprime este código para el empleado</div><button class="btn" onclick="this.parentNode.style.display='none'">Cerrar</button></div>
 <div class="card" id="empList"></div>
</section>

<section id="log" class="hide">
 <div class="card"><input type="date" id="fDate"><div id="tot" class="mu" style="margin-top:8px"></div>
  <div class="tw" style="margin-top:8px"><table><thead><tr><th>Nº</th><th>Nombre</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr></thead><tbody id="tb"></tbody></table></div>
  <button class="btn" id="csv">Copiar CSV</button></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let D={emps:[],recs:[]};
try{const s=localStorage.getItem('reg_v1');if(s)D=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('reg_v1',JSON.stringify(D))}catch(e){}};
const API=',KEY='https://script.google.com/macros/s/AKfycbyl4m-KuhA4Mopt_O0sPX2yC7TduGVWyTKbL0AFAibiGFp82-WSFP4sIc6XszxB7XgL5w/exec',KEY='Asist-2026-xK9''; // pega aquí la URL de Apps Script y la misma clave
async function call(a,d){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:KEY,action:a,...d})});return r.json()}
function setSync(t){$('#sync').textContent=t}
async function pull(){if(!API)return;try{const r=await call('get');if(!r.ok)throw 0;D.emps=r.emps;D.recs=r.recs;save();renderEmps();renderLog();setSync('☁️ Sincronizado con Google Sheets')}catch(e){setSync('⚠️ Sin conexión: usando datos locales')}}
async function push(a,d){if(!API)return;try{const r=await call(a,d);if(!r.ok)throw 0;setSync('☁️ Sincronizado con Google Sheets')}catch(e){setSync('⚠️ No se pudo guardar en Google Sheets')}}
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dur=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
setInterval(()=>{const n=new Date();$('#clock').textContent=hm(n);$('#date').textContent=n.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})},500);

// ---- cámara
let stream=null,scanning=false,mode='num',busy=false,camErr='';
async function cam(v){stopCam();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});v.srcObject=stream;await v.play();return true}catch(e){camErr=e.name||'error';return false}}
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

// ---- registro
function show(ok,html){const r=$('#res');r.className='res '+(ok?'ok':'ko');r.innerHTML=html;clearTimeout(show.t);show.t=setTimeout(()=>r.className='res',6000)}
async function register(id,via){if(API)await pull();
 id=String(id).trim();const e=D.emps.find(x=>x.id===id);
 if(!e){show(false,'<b>Empleado no encontrado</b><div class="mu">Nº '+esc(id)+'</div>');return false}
 const now=Date.now(),open=D.recs.find(r=>r.emp===id&&!r.out);
 if(open){open.out=now;open.outVia=via;save();push('out',{rid:open.rid,out:now,hrs:+((now-open.in)/3600000).toFixed(2)});
  const today=D.recs.filter(r=>r.emp===id&&r.out&&dk(r.in)===dk(now)).reduce((a,r)=>a+r.out-r.in,0);
  show(true,'<b>👋 Salida registrada</b><div>'+esc(e.name)+'</div><div>Entrada '+hm(open.in)+' · Salida '+hm(now)+'</div><div><b>Horas laboradas: '+dur(now-open.in)+'</b></div><div class="mu">Total del día: '+dur(today)+'</div>')}
 else{const nr={rid:'r'+now+Math.floor(Math.random()*999),emp:id,in:now,out:null,inVia:via};D.recs.push(nr);save();push('in',{rid:nr.rid,emp:id,name:e.name,in:now,via});
  show(true,'<b>✅ Entrada registrada</b><div>'+esc(e.name)+'</div><div>'+hm(now)+'</div>')}
 renderLog();return true}
$('#numBtn').onclick=async()=>{if(await register($('#numIn').value,'número'))$('#numIn').value=''};
$('#numIn').onkeydown=e=>{if(e.key==='Enter')$('#numBtn').click()};

// ---- modos
async function setMode(m){mode=m;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('#m-num').classList.toggle('hide',m!=='num');$('#m-cam').classList.toggle('hide',m==='num');$('#faceBtn').classList.toggle('hide',m!=='face');$('#faceLbl').classList.toggle('hide',m!=='face');
 stopCam();if(m==='num')return;
 const ok=await cam($('#vid'));$('#camHint').textContent=ok?(m==='qr'?'Muestra tu código QR a la cámara':'Mira a la cámara y pulsa “Reconocer rostro”'):'No se pudo abrir la cámara ('+camErr+'). Abre la app en su propia pestaña, permite la cámara, o usa “Tomar foto”.';
 if(ok&&m==='qr'){scanning=true;scanLoop()}}
$$('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function scanLoop(){if(!scanning)return;const v=$('#vid');
 if(!busy&&v.videoWidth){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0);
  const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
  if(q&&q.data.startsWith('EMP:')){busy=true;register(q.data.slice(4),'QR');setTimeout(()=>busy=false,4000)}}
 requestAnimationFrame(scanLoop)}

// ---- rostro (descriptor simple 16x16 en grises)
function desc(v){const W=v.videoWidth||v.naturalWidth,H=v.videoHeight||v.naturalHeight,s=Math.min(W,H)*.7,c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
 x.drawImage(v,(W-s)/2,(H-s)/2,s,s,0,0,16,16);const d=x.getImageData(0,0,16,16).data,a=[];
 for(let i=0;i<d.length;i+=4)a.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
 const m=a.reduce((p,q)=>p+q)/a.length,z=a.map(t=>t-m),n=Math.hypot(...z)||1;return z.map(t=>t/n)}
const sim=(a,b)=>a.reduce((s,t,i)=>s+t*b[i],0);
const recog=d=>{const sc=[];
 D.emps.forEach(e=>{if(e.face&&e.face.length)sc.push([e,Math.max(...e.face.map(f=>sim(d,f)))])});
 sc.sort((a,b)=>b[1]-a[1]);
 if(!sc.length)return show(false,'<b>No hay rostros registrados</b>');
 if(sc[0][1]>=.9&&(!sc[1]||sc[0][1]-sc[1][1]>=.02))register(sc[0][0].id,'rostro');
 else show(false,'<b>Rostro no reconocido</b><div class="mu">Intenta con mejor luz o usa otro método</div>')};

// ---- empleados
$('#faceBtn').onclick=()=>{const v=$('#vid');if(v.videoWidth)recog(desc(v))};
function fromFile(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>cb(desc(i));i.src=r.result};r.readAsDataURL(f)}
$('#faceFile2').onchange=e=>{fromFile(e.target.files[0],recog);e.target.value=''};
$('#faceFile').onchange=e=>{fromFile(e.target.files[0],d=>{if(!faceFor)return;faceFor.face.push(d);$('#cnt').textContent=faceFor.face.length;save()});e.target.value=''};
let faceFor=null;
function renderEmps(){$('#empList').innerHTML=D.emps.length?D.emps.map(e=>'<div class="row"><div><b>'+esc(e.name)+'</b><div class="mu">Nº '+esc(e.id)+' · '+(e.face&&e.face.length?'rostro ✓':'sin rostro')+'</div></div><div><button class="btn s" data-a="qr" data-i="'+esc(e.id)+'">QR</button><button class="btn s" data-a="face" data-i="'+esc(e.id)+'">Rostro</button><button class="btn s" data-a="del" data-i="'+esc(e.id)+'">✕</button></div></div>').join(''):'<div class="mu">Aún no hay empleados.</div>'}
$('#empList').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const id=b.dataset.i,e=D.emps.find(x=>x.id===id);
 if(b.dataset.a==='del'){if(confirm('¿Eliminar a '+e.name+'?')){D.emps=D.emps.filter(x=>x.id!==id);save();push('delEmp',{id});renderEmps()}}
 if(b.dataset.a==='qr'){$('#qrCard').style.display='block';$('#qrTitle').textContent=e.name+' · Nº '+e.id;try{const q=qrcode(0,'M');q.addData('EMP:'+id);q.make();$('#qrbox').innerHTML=q.createSvgTag(7,14)}catch(err){$('#qrbox').textContent='No se pudo generar el QR'}$('#qrTxt').textContent='Código: EMP:'+id}
 if(b.dataset.a==='face'){faceFor=e;e.face=[];$('#cnt').textContent=0;$('#faceCard').style.display='block';$('#faceTitle').textContent='Registrar rostro: '+e.name;
  if(!await cam($('#vid2')))alert('No se pudo abrir la cámara ('+camErr+'). Usa la opción de tomar/subir foto.')}};
$('#snap').onclick=()=>{const v=$('#vid2');if(!v.videoWidth||!faceFor)return;faceFor.face.push(desc(v));$('#cnt').textContent=faceFor.face.length;save()};
$('#faceDone').onclick=()=>{if(faceFor)push('saveEmp',{emp:faceFor});stopCam();$('#faceCard').style.display='none';faceFor=null;renderEmps()};
$('#addEmp').onclick=()=>{const id=$('#eId').value.trim(),n=$('#eName').value.trim();if(!id||!n)return;
 if(D.emps.some(e=>e.id===id))return alert('Ese número ya existe.');D.emps.push({id,name:n,face:[]});save();push('saveEmp',{emp:{id,name:n,face:[]}});$('#eId').value=$('#eName').value='';renderEmps()};

// ---- registros
$('#fDate').value=dk(Date.now());$('#fDate').onchange=renderLog;
function rows(){const f=$('#fDate').value;return D.recs.filter(r=>dk(r.in)===f).sort((a,b)=>a.in-b.in).map(r=>{const e=D.emps.find(x=>x.id===r.emp);return{id:r.emp,name:e?e.name:'(eliminado)',i:r.in,o:r.out,ms:(r.out||Date.now())-r.in,open:!r.out}})}
function renderLog(){const R=rows();$('#tb').innerHTML=R.length?R.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(r.name)+'</td><td>'+hm(r.i)+'</td><td>'+(r.o?hm(r.o):'<span class="mu">—</span>')+'</td><td>'+(r.open?'<span class="mu">En curso</span>':dur(r.ms))+'</td></tr>').join(''):'<tr><td colspan="5" class="mu">Sin registros en esta fecha.</td></tr>';
 $('#tot').textContent='Horas totales (turnos cerrados): '+dur(R.filter(r=>!r.open).reduce((a,r)=>a+r.ms,0))}
$('#csv').onclick=async()=>{const t='Numero,Nombre,Entrada,Salida,Horas\n'+rows().map(r=>[r.id,'"'+r.name+'"',hm(r.i),r.o?hm(r.o):'',r.open?'':(r.ms/3600000).toFixed(2)].join(',')).join('\n');
 try{await navigator.clipboard.writeText(t);$('#csv').textContent='¡Copiado!'}catch(e){prompt('Copia el CSV:',t)}setTimeout(()=>$('#csv').textContent='Copiar CSV',1500)};

// ---- pestañas
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 ['reg','emp','log'].forEach(t=>$('#'+t).classList.toggle('hide',t!==b.dataset.t));
 stopCam();if(b.dataset.t==='reg')setMode(mode);if(b.dataset.t==='emp')renderEmps();if(b.dataset.t==='log')renderLog()});
renderEmps();renderLog();
if(API){setSync('Conectando…');pull();setInterval(()=>{if(!faceFor)pull()},60000)}else setSync('Modo local (sin Google Sheets)');
</script></body></html>
